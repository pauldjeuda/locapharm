name: Bug report
description: Report an application or data issue
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Include the version shown in Settings.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result
      description: Do not include personal health information or exact location coordinates.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
