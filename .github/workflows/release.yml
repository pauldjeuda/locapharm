name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix (for example 0.1.0)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: build, sign, and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must use X.Y.Z without a v prefix" >&2
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be built from main." >&2
            exit 1
          fi
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json conclusion --jq 'length')"
          if [[ "$successful_runs" == "0" ]]; then
            echo "A successful ci.yml run for this exact main commit is required before release." >&2
            exit 1
          fi
      - run: npm ci
      - name: Set app version
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/set-app-version.mjs "$VERSION"
      - name: Configure the public Worker endpoint
        env:
          LOCAPHARM_WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
        run: node scripts/set-worker-runtime-config.mjs
      - run: npm run build
      - name: Build and sign APK
        id: apk
        working-directory: app
        env:
          VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap add android
          node ../scripts/set-android-version.mjs android/app/build.gradle "$VERSION"
          npx cap sync android
          cd android
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            ./gradlew --no-daemon assembleRelease
            source_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
            [[ -f "$source_apk" ]] || source_apk="app/build/outputs/apk/release/app-release.apk"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/locapharm-release.jks"
            build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            "$build_tools/zipalign" -p -f 4 "$source_apk" "$RUNNER_TEMP/locapharm-aligned.apk"
            "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/locapharm-release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" --out "$RUNNER_TEMP/locapharm-signed.apk" "$RUNNER_TEMP/locapharm-aligned.apk"
            "$build_tools/apksigner" verify --print-certs "$RUNNER_TEMP/locapharm-signed.apk"
            cp "$RUNNER_TEMP/locapharm-signed.apk" "$RUNNER_TEMP/locapharm-v$VERSION.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/locapharm-v$VERSION.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$RUNNER_TEMP/locapharm-release.jks" "$RUNNER_TEMP/locapharm-aligned.apk" "$RUNNER_TEMP/locapharm-signed.apk"
          sha256sum "$RUNNER_TEMP/locapharm-v$VERSION.apk" | tee "$RUNNER_TEMP/locapharm-v$VERSION.apk.sha256"
      - name: Write release notes
        env:
          VERSION: ${{ inputs.version }}
          SIGNED: ${{ steps.apk.outputs.signed }}
        run: |
          if [[ "$SIGNED" == "true" ]]; then
            note="APK signé avec le keystore de production."
          else
            note="PRÉ-RELEASE DE TEST : APK signé en debug, non signé pour production. Il ne pourra pas mettre à jour une installation signée avec le keystore de production."
          fi
          printf '# Locapharm v%s\n\n%s\n\nCette version ne confirme pas la couverture des pharmacies ni des tours de garde. Appelez avant de vous déplacer.\n' "$VERSION" "$note" > "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Locapharm v${{ inputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ runner.temp }}/locapharm-v${{ inputs.version }}.apk
            ${{ runner.temp }}/locapharm-v${{ inputs.version }}.apk.sha256
          prerelease: ${{ steps.apk.outputs.signed != 'true' }}
